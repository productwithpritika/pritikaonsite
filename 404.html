<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pritika's Portfolio</title>
    <script>
      // GitHub Pages serves this for unknown paths (e.g. /pritikaonsite/case/bookings).
      // Send it to the site root as ?/case/bookings; index.html restores the path.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
